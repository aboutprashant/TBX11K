[project]
name = "tbx11k"
version = "0.1.0"
description = "Replication of Liu et al., CVPR 2020: Rethinking Computer-aided Tuberculosis Diagnosis (TBX11K)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gdown>=6.4.2",
    "pycocotools>=2.0.11",
    "scikit-learn>=1.9.1",
    "torch",
    "torchvision",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
